name: ${COMPOSE_PROJECT_NAME:-video-ai-platform}

x-app-common: &app-common
  restart: unless-stopped
  init: true
  env_file:
    - path: .env
      required: false
  networks:
    - backend
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:?Defina DATABASE_URL no .env}
  REDIS_URL: ${REDIS_URL:?Defina REDIS_URL no .env}
  CREDENTIAL_SECRET: ${CREDENTIAL_SECRET:?Defina CREDENTIAL_SECRET no .env}
  JWT_SECRET: ${JWT_SECRET:-${APP_SECRET:?Defina JWT_SECRET ou APP_SECRET no .env}}
  JWT_TTL_MINUTES: ${JWT_TTL_MINUTES:-720}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  RENDER_MAX_ATTEMPTS: ${RENDER_MAX_ATTEMPTS:-3}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-video-ai-local}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER no .env}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no .env}
  SIGNED_URL_TTL_SECONDS: ${SIGNED_URL_TTL_SECONDS:-900}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-524288000}
  KOKORO_VOICE: ${KOKORO_VOICE:-pf_dora}
  ALLOW_LIVE_PUBLISH: ${ALLOW_LIVE_PUBLISH:-false}
  YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
  YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
  TIKTOK_CLIENT_KEY: ${TIKTOK_CLIENT_KEY:-}
  TIKTOK_CLIENT_SECRET: ${TIKTOK_CLIENT_SECRET:-}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.minio
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    image: video-ai-platform-minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Defina MINIO_ROOT_USER no .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Defina MINIO_ROOT_PASSWORD no .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    <<: *app-common
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    environment:
      <<: *app-env
      CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}
      WEB_BASE_URL: http://localhost:${WEB_PORT:-3000}
      OAUTH_REDIRECT_BASE: ${OAUTH_REDIRECT_BASE:-http://localhost:${WEB_PORT:-3000}/api/v1/oauth/callback}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - artifacts:/workspace/artifacts
      - ./config:/workspace/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *app-common
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    environment:
      <<: *app-env
    mem_limit: ${WORKER_MEMORY_LIMIT:-3g}
    volumes:
      - artifacts:/workspace/artifacts
      - ./config:/workspace/config:ro
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    <<: *app-common
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.web
      args:
        API_INTERNAL_URL: http://api:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/login"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  backend:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  artifacts:
